# SDK adapter layers, from the protocol kernel outward. These packages implement
# BAM REST capabilities; they are not an application's pure business domain.
# See docs/adr/0003-sdk-composition.md for ARC-1/ARC-2 and the public API boundary.
declared:
  - .
  - ./configuration
  - ./deployment
  - ./dhcp
  - ./dns
  - ./dns/accesscontrol
  - ./dns/responsepolicy
  - ./internal/resource
  - ./ipam
rules:
  - name: protocol kernel does not import SDK adapters
    packages: [.]
    deny: [./...]
  - name: shared resource helpers only depend on transport
    packages: [./internal/resource]
    only_local: [.]
  - name: endpoint adapters use the protocol kernel and typed resource helpers
    packages: [./configuration, ./deployment, ./dns, ./dns/responsepolicy, ./ipam]
    only_local: [., ./internal/resource]
  - name: DHCP composition depends inward on IPAM address contracts
    packages: [./dhcp]
    only_local: [., ./internal/resource, ./ipam]
  - name: access control composition depends inward on DNS option contracts
    packages: [./dns/accesscontrol]
    only_local: [., ./internal/resource, ./dns]
  - name: SDK adapters do not own process filesystem or database access
    packages: [./configuration, ./deployment, ./dhcp, ./dns/..., ./ipam, ./internal/resource]
    deny: [os/..., database/sql/..., net/rpc/..., net/smtp]
